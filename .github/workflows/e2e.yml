name: e2e

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Build
        run: bun run build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-secret' }}

      # The e2e suite's webServer runs `next dev` against a fresh sqlite db
      # (see apps/web/playwright.config.ts) — without this, every image field
      # is null and design-fidelity.spec.ts fails on "images failed to load".
      #
      # The credentials create the editor account cms-round-trip.spec.ts logs in
      # as. Repository *variables*, not secrets, and deliberately so: this
      # database is built from scratch here and thrown away with the runner, the
      # account only ever exists inside it, and a value masked in the logs would
      # make a failed login harder to diagnose for no security gained. The
      # fallbacks keep a fork's pull request runnable.
      - name: Seed CMS content
        run: bun run --cwd apps/web seed
        env:
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL || 'e2e@example.com' }}
          E2E_USER_PASSWORD: ${{ vars.E2E_USER_PASSWORD || 'e2e-ci-password' }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-secret' }}

      - name: Run e2e suite
        run: bun run e2e
        env:
          E2E_USER_EMAIL: ${{ vars.E2E_USER_EMAIL || 'e2e@example.com' }}
          E2E_USER_PASSWORD: ${{ vars.E2E_USER_PASSWORD || 'e2e-ci-password' }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-secret' }}

      # apps/web/e2e-results/design holds one render per section from
      # apps/web/e2e/design-fidelity.spec.ts; on a failure the Playwright report also has
      # the render attached beside its Figma reference.
      - name: Upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: apps/web/e2e-results/
          retention-days: 14
