name: CI
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Must match e2e.yml and package.json's packageManager field.
          bun-version: 1.3.11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run validate:manifest
      # Regenerate and diff before the drift check: check:cms-drift only
      # compares payload.config.ts against generated text, not the
      # translatable-flip guard or .payload-field-locales.json. Running the
      # generator here fails the build if either drifts from the manifest.
      - run: bun run --cwd apps/web gen:cms
      - run: git diff --exit-code -- apps/web/payload.config.ts apps/web/.payload-field-locales.json
      - run: bun run --cwd apps/web check:cms-drift
      - run: bun run lint
      - run: bun run test
      # payload.config.ts throws rather than fall back to its dev secret when
      # NODE_ENV is production, which `next build` sets — so a build cannot load
      # the config without this. The `||` fallback is not laziness: a pull
      # request from a fork gets no secrets, and a build that fails there for
      # want of a value that is not a real credential teaches contributors to
      # ignore red checks. The repository secret is what CI uses when it has one.
      # BLOB_READ_WRITE_TOKEN is required in production for the same reason and
      # by the same mechanism (ADR-0014). A placeholder is honest here: this
      # build compiles and collects page data, it never uploads a file. It also
      # means a green build proves nothing about media storage on the
      # deployment — `bun run parity-report` is what checks that.
      - run: bun run build
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-build-secret' }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN || 'ci-placeholder-token' }}
